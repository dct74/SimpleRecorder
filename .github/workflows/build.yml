name: build

# Tag pushes build the binary and attach it to the GitHub release for that tag.
# Pushes to main and pull requests only verify that the project still builds.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

# Needed so the release step can create/update a release with the built binary.
permissions:
  contents: write

jobs:
  windows-x64:
    name: Windows x64 (MSVC)
    runs-on: windows-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The project needs nothing but the OS: no vcpkg, no third party packages.
      # Let CMake pick the newest Visual Studio generator available on the runner.
      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Locate the executable and compute its checksum
        id: artifact
        shell: pwsh
        run: |
          $expected = @(
            'build\bin\Release\SimpleRecorder.exe',   # multi-config generators
            'build\bin\SimpleRecorder.exe'            # single-config generators
          )
          $exe = $expected | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) {
            $exe = (Get-ChildItem build -Recurse -Filter SimpleRecorder.exe |
                    Select-Object -First 1).FullName
          }
          if (-not $exe -or -not (Test-Path $exe)) { throw 'SimpleRecorder.exe was not produced' }

          $item = Get-Item $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          "path=$exe"                 >> $env:GITHUB_OUTPUT
          "name=$($item.Name)"        >> $env:GITHUB_OUTPUT
          "size=$($item.Length)"      >> $env:GITHUB_OUTPUT
          "sha256=$hash"              >> $env:GITHUB_OUTPUT

          Write-Host "built : $exe"
          Write-Host ("size  : {0:N0} bytes" -f $item.Length)
          Write-Host "sha256: $hash"

      # Exit codes of --selftest: 0 = everything passed, 2 = writer tests passed but
      # the runner has no audio endpoint (capture parts skipped), 1 = failure.
      # Start-Process -Wait is required: PowerShell does not wait for a GUI
      # subsystem executable, so $LASTEXITCODE would be empty.
      - name: Self test
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'selftest'
          $log = Join-Path $out 'log.txt'
          $exe = "${{ steps.artifact.outputs.path }}"

          $process = Start-Process -FilePath $exe -ArgumentList @('--selftest', '1', $out, $log) -Wait -PassThru
          $code = $process.ExitCode

          if (Test-Path $log) { Get-Content $log -Encoding UTF8 | ForEach-Object { Write-Host $_ } }
          Write-Host "--selftest exit code: $code"

          if ($code -eq 2) { Write-Host '::notice::no audio endpoint on this runner - capture tests skipped' }
          elseif ($code -ne 0) { throw "self test failed with exit code $code" }

      - name: Upload the executable as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleRecorder-x64
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error

      # Renders .github/release-notes.md with the values that only exist after the
      # build.  Available placeholders: {{VERSION}} {{COMMIT}} {{BUILD_DATE}}
      # {{SIZE}} {{SHA256}} - any placeholder left unreplaced fails the job, so a
      # release can never be published with a stale checksum.
      - name: Render the release notes
        if: startsWith(github.ref, 'refs/tags/v')
        id: notes
        shell: pwsh
        run: |
          $template = '.github/release-notes.md'
          if (-not (Test-Path $template)) { throw "$template is missing" }

          $size = [long]'${{ steps.artifact.outputs.size }}'
          $sha = '${{ steps.artifact.outputs.sha256 }}'
          $commit = '${{ github.sha }}'

          $notes = [System.IO.File]::ReadAllText($template, [System.Text.Encoding]::UTF8)
          $notes = $notes.Replace('{{VERSION}}', $env:GITHUB_REF_NAME)
          $notes = $notes.Replace('{{COMMIT}}', $commit.Substring(0, 7))
          $notes = $notes.Replace('{{BUILD_DATE}}', (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd'))
          $notes = $notes.Replace('{{SIZE}}', ('{0:N0} 字节（{1:N0} KiB）' -f $size, ($size / 1KB)))
          $notes = $notes.Replace('{{SHA256}}', $sha)

          $leftover = [regex]::Matches($notes, '\{\{[A-Z0-9_]+\}\}')
          if ($leftover.Count -gt 0) {
            throw "unreplaced placeholder(s): $(($leftover | ForEach-Object { $_.Value }) -join ', ')"
          }

          $path = Join-Path $env:RUNNER_TEMP 'release-notes.rendered.md'
          [System.IO.File]::WriteAllText($path, $notes, (New-Object System.Text.UTF8Encoding($false)))
          "path=$path" >> $env:GITHUB_OUTPUT
          Write-Host "rendered the release notes from $template"

      - name: Attach the executable to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ steps.artifact.outputs.sha256 }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $exe = "${{ steps.artifact.outputs.path }}"
          $notes = "${{ steps.notes.outputs.path }}"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "release $tag already exists - replacing the asset and the notes"
            gh release upload $tag $exe --clobber
            gh release edit $tag --notes-file $notes
          } else {
            Write-Host "creating release $tag"
            $arguments = @($tag, $exe, '--title', $tag, '--notes-file', $notes)
            if ($tag -match '-') {
              # e.g. v1.1.0-rc1: publish as pre-release so it does not become "Latest".
              Write-Host 'tag contains a suffix - marking the release as a pre-release'
              $arguments += '--prerelease'
            }
            gh release create @arguments
          }

          Write-Host "attached sha256: $env:SHA256"
          gh release view $tag --json tagName,isDraft,assets
